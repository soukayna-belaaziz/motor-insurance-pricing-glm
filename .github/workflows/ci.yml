name: tests

# Unit tests only: they use small simulated fixtures, so CI does not need
# the freMTPL2 data or the full pipeline.
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q tests

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true
      - name: Install R packages
        # MASS and splines are base/recommended packages shipped with R.
        run: Rscript -e 'install.packages(c("testthat", "data.table"))'
      - name: testthat
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
